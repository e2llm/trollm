org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Repo-relative path of the Rust workspace (used by the UniFFI build tasks).
trollm.repoDir=../..
# Rust features for the on-device build. `llama` is the real runtime;
# `stub` is for UI development without model weights.
trollm.rustFeatures=llama
