                type: array
                minItems: 1
                maxItems: 1
        compact:
          fromArtifact: filtered-records
          format: json
          type: object
          view:
            fields:
              matches:
                selected:
                  id: true
                  tag: true
                  text: true
                  aria:
                    label: true
                    role: true
                  hints:
                    nav: true
                  layout:
                    visible: true
            maxBytes: 24576
      requireArtifactComplete:
      - filtered-records

  amazon-cart-final_cart_identity:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.assert_equal
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.assert_equal:
        modelFields: []
        fromVars:
          left: final_cart_inspect.outputs.data.id
