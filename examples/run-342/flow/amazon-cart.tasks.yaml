          type: list
      requireArtifactComplete:
      - e2llm.query.latest
  amazon-cart-final:
    model: reasoner
    prompt: prompts/final-verification.md
    tools: []
    completion: model-prose
    maxOutputTokens: 768
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    outputContract:
