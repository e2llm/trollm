          from: model
          type: prose
  amazon-cart-final_anchor_identity:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.assert_equal
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.assert_equal:
