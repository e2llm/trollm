        data:
          fromArtifact: element
          format: json
          type: object
        compact:
          fromArtifact: element
          format: json
          type: object
          view:
            fields:
              id: true
              tag: true
              text: true
              aria: true
              actions: true
              interactive: true
              layout:
                visible: true
              attributes:
                type: true
                name: true
                value: true
                placeholder: true
