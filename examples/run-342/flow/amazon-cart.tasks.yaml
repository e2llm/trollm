schemaVersion: ledger.task-registry.v1
id: amazon-cart
version: 300
tasks:
  amazon-cart-baseline:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.calculate
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.calculate:
        modelFields: []
        fromVars:
          left: counter_field.outputs.data.selected.text
        fixed:
          operation: compare
          right: '0'
    outputContract:
      outputs:
        data:
          fromArtifact: calculation
          format: json
          type: object
      requireArtifactComplete:
      - calculation
  amazon-cart-baseline_gate:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.assert_equal
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.assert_equal:
        modelFields: []
        fromVars:
          left: baseline.outputs.data.result
        fixed:
          right: equal
    outputContract:
      outputs:
        data:
          fromArtifact: equality-proof
          format: json
          type: object
      requireArtifactComplete:
      - equality-proof
  amazon-cart-budget_context:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.calculate
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.calculate:
        modelFields: []
        fixed:
          operation: compare
          left: '0'
        fromInput:
          right: budget
    outputContract:
      outputs:
        data:
          fromArtifact: calculation
          format: json
          type: object
      requireArtifactComplete:
      - calculation
  amazon-cart-cart_headings:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.filter_records
    completion: tool-result
    maxOutputTokens: 128
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.filter_records:
        modelFields: []
        fromVars:
          items: final_anchor_query.outputs.data
        fixed:
          schema:
            anyOf:
            - type: object
              required:
              - tag
              properties:
                tag:
                  enum:
                  - h1
                  - h2
                  - h3
                  - h4
                  - h5
                  - h6
            - type: object
              required:
              - aria
              properties:
                aria:
                  type: object
                  required:
                  - role
                  properties:
                    role:
                      const: heading
    outputContract:
      outputs:
        data:
          fromArtifact: filtered-records
          format: json
          type: object
          schema:
            type: object
            required:
            - matchedCount
            properties:
              matchedCount:
                type: integer
                minimum: 1
        compact:
          fromArtifact: filtered-records
          format: json
          type: object
          view:
            fields:
              matches:
                selected:
                  id: true
                  tag: true
                  text: true
                  aria: true
                  layout:
                    visible: true
                    bbox: true
            maxBytes: 16384
        selection_view:
          fromArtifact: filtered-records
          format: json
          type: object
          view:
            fields:
              matches:
                index: true
                selected:
                  id: true
                  tag: true
                  text: true
                  selector: true
                  aria: true
                  attributes: true
                  layout:
                    bbox: true
                    visible: true
                  depth: true
                  options: true
                  actions: true
                  interactive: true
            maxBytes: 16384
      requireArtifactComplete:
      - filtered-records

  amazon-cart-cart_regions_prepare:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.filter_records
    completion: tool-result
    maxOutputTokens: 128
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.filter_records:
        modelFields: []
        fixed:
          items:
          - purpose: CURRENT CART active product lines and their own quantity controls; exclude saved-for-later
              products and recommendations
          schema:
            type: object
    outputContract:
      outputs:
        data:
          fromArtifact: filtered-records
          format: json
          type: object
      requireArtifactComplete:
      - filtered-records
  amazon-cart-counter_anchor:
    model: coder
    prompt: prompts/select-advice.md
    tools:
    - local.select_unique
    - flow.choose
    completion: tool-or-route
    maxOutputTokens: 192
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.select_unique:
        modelFields:
        - equals
        fromVars:
          items: initial_query.outputs.data
        fixed:
          field: /id
          prefix: ''
    outputContract:
      outputs:
        data:
          fromArtifact: unique-selection
          format: json
          type: object
          schema:
            type: object
            required:
            - selected
            properties:
              selected:
                anyOf:
                - type: object
                  required:
                  - text
                  properties:
                    text:
                      type: string
                      pattern: '[0-9]'
                - type: object
                  required:
                  - aria
                  properties:
                    aria:
                      type: object
                      required:
                      - label
                      properties:
                        label:
                          type: string
                          pattern: '[0-9]'
      requireArtifactComplete:
      - unique-selection
  amazon-cart-counter_anchor_identity:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.assert_equal
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.assert_equal:
        modelFields: []
        fromVars:
          left: counter_anchor_inspect.outputs.data.id
          right: counter_anchor.outputs.data.selected.id
    outputContract:
      outputs:
        data:
          fromArtifact: equality-proof
          format: json
          type: object
      requireArtifactComplete:
      - equality-proof
  amazon-cart-counter_anchor_inspect:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - e2llm.inspect
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      e2llm.inspect:
        modelFields: []
        fromVars:
          sessionId: initial_capture.outputs.data.sessionId
          nodeId: counter_anchor.outputs.data.selected.id
    outputContract:
      outputs:
        data:
          fromArtifact: element
          format: json
          type: object
      requireArtifactComplete:
      - element
  amazon-cart-counter_anchor_target:
    model: reasoner
    prompt: prompts/reasoner.md
    tools: []
    completion: model-prose
    maxOutputTokens: 384
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    outputContract:
      outputs:
        advice:
          from: model
          type: prose
  amazon-cart-counter_field:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.select_matching
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.select_matching:
        modelFields: []
        fromVars:
          items: counter_fields.outputs.data
        fixed:
          schema:
            type: object
            required:
            - id
            - selector
            - text
            properties:
              text:
                type: string
                pattern: ^[0-9]+$
    outputContract:
      outputs:
        data:
          fromArtifact: matching-selection
          format: json
          type: object
      requireArtifactComplete:
      - matching-selection
  amazon-cart-counter_field_identity:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - local.assert_equal
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      local.assert_equal:
        modelFields: []
        fromVars:
          left: counter_field_inspect.outputs.data.id
          right: counter_field.outputs.data.selected.id
    outputContract:
      outputs:
        data:
          fromArtifact: equality-proof
          format: json
          type: object
      requireArtifactComplete:
      - equality-proof
  amazon-cart-counter_field_inspect:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - e2llm.inspect
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      e2llm.inspect:
        modelFields: []
        fromVars:
          sessionId: initial_capture.outputs.data.sessionId
          nodeId: counter_field.outputs.data.selected.id
    outputContract:
      outputs:
        data:
          fromArtifact: element
          format: json
          type: object
      requireArtifactComplete:
      - element
  amazon-cart-counter_fields:
    model: coder
    prompt: prompts/fixed.md
    tools:
    - e2llm.query
    completion: tool-result
    maxOutputTokens: 256
    generationTimeoutS: 600
    loop:
      maxSteps: 1
    toolArguments:
      e2llm.query:
        modelFields: []
        fromVars:
          sessionId: initial_capture.outputs.data.sessionId
          selector: counter_anchor_inspect.outputs.data.selector
    outputContract:
      outputs:
        data:
          fromArtifact: e2llm.query.latest
