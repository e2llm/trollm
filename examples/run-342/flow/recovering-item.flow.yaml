      an actual canonical id from these original records: {{ input_controls.outputs.compact.matches }}.
      If no unambiguous supported target exists, choose unresolved. For equals use only the top-level
      canonical id, including any leading #. Copy the id field exactly; do not substitute attributes.id
      or a label.'
