schemaVersion: ledger.execution-plan.v1
input:
  promptTemplate: '{{ user_input }}'
limits:
  maxSteps: 600
  maxReasonerCalls: 128
  maxTokensTotal: 1000000
  timeoutS: 7200
  artifactMaxMb: 64
onLimit: abort
models:
  coder:
    ctx: 8192
  reasoner:
    ctx: 8192
id: recovering-price-group
version: 322
entryStep: read_offers
mcp:
  servers:
  - name: e2llm
    url: https://mcp.e2llm.com/mcp
  policies:
    e2llm.list_tabs:
      class: read
      timeoutS: 60
      resultArtifact: tabs
      resultValidation:
        maxBytes: 32768
        schema:
          type: object
          required:
          - tabs
          properties:
            tabs:
              type: array
              minItems: 1
              maxItems: 1
    e2llm.sifr_capture:
      class: read
      timeoutS: 60
      resultArtifact: observation
    e2llm.query:
      class: read
      timeoutS: 60
      cache:
        ttlS: 0
        key: []
      paginate:
        param: cursor
        deliver: first_page
        backgroundFetch: all
        responseCursor: /pagination/cursor
        responseHasMore: /pagination/hasMore
    e2llm.inspect:
      class: read
      timeoutS: 60
      resultArtifact: element
    e2llm.act:
      class: mutation
      passthrough: true
      timeoutS: 60
      resultArtifact: action
    e2llm.read_page:
      class: read
      timeoutS: 60
      resultArtifact: browser-text
    local.extract_decimal:
      class: read
      resultArtifact: price-extraction
    local.calculate:
      class: read
      resultArtifact: calculation
      resultValidation:
        maxBytes: 1024
        schema:
          type: object
          additionalProperties: false
          required:
          - format
          - operation
          - left
          - right
          - result
          properties:
            format:
              const: trollm.local.calculate.v1
            operation:
              enum:
              - multiply
              - add
              - compare
              - subtract
              - divide
            left:
              type: string
            right:
              type: string
            result:
              type: string
              minLength: 1
    local.select_matching:
      class: read
      resultArtifact: matching-selection
    local.select_unique:
      class: read
      resultArtifact: unique-selection
      resultValidation:
        maxBytes: 262144
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: local.select_unique v1 result
          type: object
          additionalProperties: false
          required:
          - selected
          - index
          - sourceSha256
          properties:
            selected:
              type: object
            index:
              type: integer
              minimum: 0
            sourceSha256:
              type: string
              pattern: ^[0-9a-f]{64}$
    local.assert_equal:
      class: read
      resultArtifact: equality-proof
      resultValidation:
        maxBytes: 1024
        schema:
          type: object
          required:
          - equal
          properties:
            equal:
              const: true
          additionalProperties: false
    local.prepare_worklist:
      class: read
      resultArtifact: prepared-worklist
      resultValidation:
        maxBytes: 49152
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          additionalProperties: false
          required:
          - format
          - context
          - items
          properties:
            format:
              const: trollm.local.prepare_worklist.v1
            context:
              type: string
              maxLength: 4096
            items:
              type: array
              minItems: 1
              maxItems: 8
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                additionalProperties: false
                required:
                - id
                - value
                properties:
                  id:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  value:
                    type: object
                    required:
                    - request
                    - quantity
                    properties:
                      request:
                        type: string
                        minLength: 1
                        maxLength: 2000
                      quantity:
                        type: string
                        pattern: ^[1-9][0-9]{0,2}$
    local.order_records:
      class: read
      resultArtifact: ordered-records
    local.filter_records:
      class: read
      resultArtifact: filtered-records
nodes:
  read_offers:
    kind: foreach
    items:
      from: price_group.items
    itemKey: index
    bindAs: price_entry
    enumeration: snapshot
    ordering: source
    maxItems: 1
    onLimit: group_next
    body:
      flowRef: recovering-offer-read
      inputs:
        price_entry:
          from: price_entry
        source_prices:
          from: source_prices
        tab_id:
          from: tab_id
        ceiling:
          from: ceiling
    outputs:
      full:
        collect: body.outputs
        indexBy: itemKey
      outcomes:
        collect: body.outputs
        indexBy: itemKey
        view:
          fields:
            id: true
            outcome: true
          maxBytes: 4096
    onEmpty: group_next
    onComplete: successful
    onItemOutcome:
      skipped: group_next
  successful:
    kind: task
    taskRef: recovering-price-group-successful
    onError:
      retry: 0
      then: group_next
    onVerified: title_query
  group_done:
    kind: end
    outcome: succeeded
  group_next:
    kind: end
    outcome: skipped
  group_rejected:
    kind: end
    outcome: skipped
  retail:
    kind: task
    taskRef: amazon-cart-primary_price_advice
    onError:
      retry: 0
      then: group_next
    promptSupplement: 'Observed candidate price record: {{ retail_guard.outputs.semantic.selected }}.'
    onVerified: primary_price_gate
  retail_guard:
    kind: task
    taskRef: recovering-price-group-retail_guard
    onError:
      retry: 0
      then: group_next
    onVerified: retail_same_source
  title_link:
    kind: task
    taskRef: recovering-price-group-title_link
    onError:
      retry: 0
      then: group_next
    onVerified: title_inspect
  retail_same_source:
    kind: task
    taskRef: recovering-price-group-retail_same_source
    onError:
      retry: 0
      then: group_next
    onVerified: retail
  identity_fit:
    kind: task
    taskRef: amazon-cart-product_fit_advice
    onError:
      retry: 0
      then: group_next
    promptSupplement: 'Observed original product title: {{ title_inspect.outputs.semantic }}. Current item
      request: {{ item.value.request }}'
    onVerified: identity_fit_gate
  identity_fit_gate:
    kind: task
    taskRef: amazon-cart-fit_dispatch
    onError:
      retry: 0
      then: group_next
    promptSupplement: 'Adviser instruction: {{ identity_fit.outputs.advice }}'
    routes:
      'yes': retail_guard
      'no': group_next
      unknown: group_next
  primary_price_gate:
    kind: task
    taskRef: amazon-cart-fit_dispatch
    promptSupplement: 'Adviser instruction: {{ retail.outputs.advice }}'
    onError:
      retry: 0
      then: group_next
    routes:
      'yes': group_done
      'no': group_next
      unknown: group_next
  title_query:
    kind: task
    taskRef: recovering-price-group-title_query
    onError:
      retry: 0
      then: group_next
    onVerified: title_link
  title_inspect:
    kind: task
    taskRef: recovering-price-group-title_inspect
    onError:
      retry: 0
      then: group_next
    onVerified: title_identity
  title_identity:
    kind: task
    taskRef: recovering-price-group-title_identity
    onError:
      retry: 0
      then: group_next
    onVerified: identity_fit
exports:
  candidates:
    from: read_offers.outputs.full
