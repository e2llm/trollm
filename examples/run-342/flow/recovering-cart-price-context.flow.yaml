schemaVersion: ledger.execution-plan.v1
id: recovering-cart-price-context
version: 1
input:
  promptTemplate: '{{ user_input }}'
models:
  coder:
    ctx: 8192
limits:
  maxSteps: 16
  maxReasonerCalls: 0
  maxTokensTotal: 131072
  timeoutS: 3600
  artifactMaxMb: 16
onLimit: abort
entryStep: row_capture
mcp:
  servers:
  - name: e2llm
    url: https://mcp.e2llm.com/mcp
  policies:
    e2llm.list_tabs:
      class: read
      timeoutS: 60
      resultArtifact: tabs
      resultValidation:
        maxBytes: 32768
        schema:
          type: object
          required:
          - tabs
          properties:
            tabs:
              type: array
              minItems: 1
              maxItems: 1
    e2llm.sifr_capture:
      class: read
      timeoutS: 60
      resultArtifact: observation
    e2llm.query:
      class: read
      timeoutS: 60
      cache:
        ttlS: 0
        key: []
      paginate:
        param: cursor
        deliver: first_page
        backgroundFetch: all
        responseCursor: /pagination/cursor
        responseHasMore: /pagination/hasMore
    e2llm.inspect:
      class: read
      timeoutS: 60
      resultArtifact: element
    e2llm.act:
      class: mutation
      passthrough: true
      timeoutS: 60
      resultArtifact: action
    e2llm.read_page:
      class: read
      timeoutS: 60
      resultArtifact: browser-text
    local.extract_decimal:
      class: read
      resultArtifact: price-extraction
    local.calculate:
      class: read
      resultArtifact: calculation
      resultValidation:
        maxBytes: 1024
        schema:
          type: object
          additionalProperties: false
          required:
          - format
          - operation
          - left
          - right
          - result
          properties:
            format:
              const: trollm.local.calculate.v1
            operation:
              enum:
              - multiply
              - add
              - compare
              - subtract
              - divide
            left:
              type: string
            right:
              type: string
            result:
              type: string
              minLength: 1
    local.select_matching:
      class: read
      resultArtifact: matching-selection
    local.select_unique:
      class: read
      resultArtifact: unique-selection
      resultValidation:
        maxBytes: 262144
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          title: local.select_unique v1 result
          type: object
          additionalProperties: false
          required:
          - selected
          - index
          - sourceSha256
          properties:
            selected:
              type: object
            index:
              type: integer
              minimum: 0
            sourceSha256:
              type: string
              pattern: ^[0-9a-f]{64}$
    local.assert_equal:
      class: read
      resultArtifact: equality-proof
      resultValidation:
        maxBytes: 1024
        schema:
          type: object
          required:
          - equal
          properties:
            equal:
              const: true
          additionalProperties: false
    local.prepare_worklist:
      class: read
      resultArtifact: prepared-worklist
      resultValidation:
        maxBytes: 49152
        schema:
          $schema: https://json-schema.org/draft/2020-12/schema
          type: object
          additionalProperties: false
          required:
          - format
          - context
          - items
          properties:
            format:
              const: trollm.local.prepare_worklist.v1
            context:
              type: string
              maxLength: 4096
            items:
              type: array
              minItems: 1
              maxItems: 8
              items:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                additionalProperties: false
                required:
                - id
                - value
                properties:
                  id:
                    type: string
                    pattern: ^[0-9a-f]{64}$
                  value:
                    type: object
                    required:
                    - request
                    - quantity
                    properties:
                      request:
                        type: string
                        minLength: 1
                        maxLength: 2000
                      quantity:
                        type: string
                        pattern: ^[1-9][0-9]{0,2}$
    local.order_records:
      class: read
      resultArtifact: ordered-records
    local.filter_records:
      class: read
      resultArtifact: filtered-records
nodes:
  currency_inspect:
    kind: task
    taskRef: price-context-currency_inspect
    onVerified: currency_identity
    onError:
      retry: 0
      then: unresolved
  currency_identity:
    kind: task
    taskRef: price-context-currency_identity
    onVerified: parent_inspect
    onError:
      retry: 0
      then: unresolved
  parent_inspect:
    kind: task
    taskRef: price-context-parent_inspect
    onVerified: parent_identity
    onError:
      retry: 0
      then: unresolved
  parent_identity:
    kind: task
    taskRef: price-context-parent_identity
    onVerified: context_inspect
    onError:
      retry: 0
      then: unresolved
  parent_read:
    kind: task
    taskRef: price-context-parent_read
    onVerified: price
    onError:
      retry: 0
      then: unresolved
  price:
    kind: task
    taskRef: price-context-price
    onVerified: normalized_price
    onError:
      retry: 0
      then: unresolved
  normalized_price:
    kind: task
    taskRef: price-context-normalized_price
    onVerified: done
    onError:
      retry: 0
      then: unresolved
  done:
    kind: end
    outcome: succeeded
  unresolved:
    kind: end
    outcome: skipped

  row_capture:
    kind: task
    taskRef: price-context-row_capture
    onVerified: currency_query
    onError:
      retry: 0
      then: unresolved

  currency_query:
    kind: task
    taskRef: price-context-currency_query
    onVerified: currency_member
    onError:
      retry: 0
      then: unresolved

  currency_member:
    kind: task
    taskRef: price-context-currency_member
    onVerified: currency_inspect
    onError:
      retry: 0
      then: unresolved

  parent_capture:
    kind: task
    taskRef: price-context-parent_capture
    onVerified: parent_read
    onError:
      retry: 0
      then: unresolved

  context_inspect:
    kind: task
    taskRef: price-context-context_inspect
    onVerified: context_identity
    onError:
      retry: 0
      then: parent_capture

  context_identity:
    kind: task
    taskRef: price-context-context_identity
    onVerified: parent_capture
    onError:
      retry: 0
      then: unresolved
