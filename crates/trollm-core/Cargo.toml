[package]
name = "trollm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
trollm-models = { path = "../trollm-models" }
trollm-mcp = { path = "../trollm-mcp" }
