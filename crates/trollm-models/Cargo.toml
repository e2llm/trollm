[package]
name = "trollm-models"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llama-cpp-2 = { version = "0.1", optional = true }
minijinja = { version = "=2.12.0", optional = true, default-features = false, features = ["builtins", "macros", "multi_template", "adjacent_loop_items", "std_collections", "serde", "json", "fuel"] }
minijinja-contrib = { version = "=2.12.0", optional = true, default-features = false, features = ["pycompat"] }

[features]
chat-template = ["dep:minijinja", "dep:minijinja-contrib"]
llama = ["dep:llama-cpp-2", "chat-template"]
