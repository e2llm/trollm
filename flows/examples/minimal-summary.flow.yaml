# Directly authored, tool-free v1 example; no browser recording is required.
schemaVersion: ledger.execution-plan.v1
id: minimal-summary
version: 1

input:
  promptTemplate: "Summarize the supplied text: {{ user_input }}"

limits:
  maxSteps: 2
  maxReasonerCalls: 0
  maxTokensTotal: 4096
  timeoutS: 60
  artifactMaxMb: 1
onLimit: abort

models:
  coder: { ctx: 4096 }

mcp:
  servers: []
  policies: {}

entryStep: summarize
nodes:
  summarize:
    kind: task
    taskRef: summarize-text
    onVerified: done
  done:
    kind: end
    outcome: succeeded
