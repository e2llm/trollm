schemaVersion: ledger.task-registry.v1
id: check-total
version: 2
tasks:
  sum-cart:
    model: coder
    prompt: prompts/sum.md
    tools: [local.calculate]
    completion: tool-result
    loop: { maxSteps: 1 }
    toolArguments:
      local.calculate:
        fixed: { operation: add }
    outputContract:
      outputs:
        calculation: { fromArtifact: calculation, format: json, type: object }
      requireArtifactComplete: [calculation]
  compare-budget:
    execution: tool
    tools: [local.calculate]
    completion: tool-result
    toolArguments:
      local.calculate:
        modelFields: []
        fromVars: { left: sum.outputs.calculation.result }
        fromInput: { right: budget }
        fixed: { operation: compare }
    outputContract:
      outputs:
        calculation: { fromArtifact: calculation, format: json, type: object }
      requireArtifactComplete: [calculation]
  advise-cart:
    model: reasoner
    prompt: prompts/advise.md
    tools: []
    loop: { maxSteps: 1 }
    outputContract:
      outputs:
        advice: { from: model, type: prose }
  report-cart:
    model: coder
    prompt: prompts/report.md
    tools: []
    loop: { maxSteps: 1 }
    outputContract:
      outputs:
        report: { from: model, type: prose }
