schemaVersion: ledger.task-registry.v1
id: browser-summary
version: 5
tasks:
  open-page:
    model: coder
    prompt: prompts/open-page.md
    tools: [e2llm.act]
    completion: tool-result
    loop: { maxSteps: 1 }
    mutations: { idempotency: intent-log, onUncertain: fail-run }
    toolArguments:
      e2llm.act:
        fromInput:
          browser: browser
          target: url
        fixed:
          action: open
    outputContract:
      outputs:
        opened: { fromArtifact: opened, format: json, type: object }
      requireArtifactComplete: [opened]
  read-page:
    model: coder
    prompt: prompts/read-page.md
    tools: [e2llm.read_page]
    completion: tool-result
    loop: { maxSteps: 1 }
    toolArguments:
      e2llm.read_page:
        fromInput:
          browser: browser
        fromVars:
          tabId: open_page.outputs.opened.tabId
    outputContract:
      outputs:
        page: { fromArtifact: page, format: json, type: object }
      requireArtifactComplete: [page]
  summarize-page:
    model: reasoner
    prompt: prompts/summarize-page.md
    tools: []
    loop: { maxSteps: 1 }
    outputContract:
      outputs:
        report: { from: model, type: prose }
