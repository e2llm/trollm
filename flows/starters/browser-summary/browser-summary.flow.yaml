schemaVersion: ledger.execution-plan.v1
id: browser-summary
version: 1
setup:
  path: setup.json
  sha256: 3aef634120c8c2a03df960db984eec47316a143e192969958ac17a334089d12e
input:
  promptTemplate: "{{ user_input }}"
limits: { maxSteps: 6, maxReasonerCalls: 1, maxTokensTotal: 24576, timeoutS: 600, artifactMaxMb: 1 }
onLimit: abort
models:
  coder: { ctx: 4096 }
  reasoner: { ctx: 4096 }
mcp:
  servers:
    - { name: e2llm, url: "https://mcp.e2llm.com/mcp" }
  policies:
    e2llm.act: { class: mutation, passthrough: true, timeoutS: 30 }
    e2llm.list_tabs:
      class: read
      timeoutS: 30
      resultValidation:
        maxBytes: 8192
        schema:
          type: object
          required: [tabs]
          properties:
            tabs:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, url, title]
                properties:
                  id: { type: integer }
                  url: { type: string }
                  title: { type: string }
                  browser: { type: string }
    e2llm.read_page:
      class: read
      timeoutS: 30
      resultArtifact: page
      resultValidation:
        maxBytes: 8192
        schema:
          type: object
          required: [content, url, stats]
          properties:
            content: { type: string, minLength: 1 }
            url: { type: string, minLength: 1 }
            stats:
              type: object
              required: [contentNodes, truncated]
              properties:
                contentNodes: { type: integer, minimum: 1 }
                truncated: { const: false }
            selectorUnmatched: { const: false }
      shape: { strip: [content], toFile: true }
entryStep: open_page
nodes:
  open_page: { kind: task, taskRef: open-page, onVerified: read_page }
  read_page: { kind: task, taskRef: read-page, onVerified: summarize }
  summarize: { kind: task, taskRef: summarize-page, onVerified: done }
  done: { kind: end, outcome: succeeded }
