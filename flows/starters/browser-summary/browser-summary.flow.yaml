schemaVersion: ledger.execution-plan.v1
id: browser-summary
version: 4
setup:
  path: setup.json
  sha256: 7ce6031b458969760322973f17260299dc8dc3beee0128a4a1bb2d777efc72a4
input:
  promptTemplate: "{{ user_input }}"
limits: { maxSteps: 3, maxReasonerCalls: 1, maxTokensTotal: 24576, timeoutS: 600, artifactMaxMb: 1 }
onLimit: abort
models:
  coder: { ctx: 4096 }
  reasoner: { ctx: 4096 }
mcp:
  servers:
    - { name: e2llm, url: "https://mcp.e2llm.com/mcp" }
  policies:
    e2llm.act:
      class: mutation
      passthrough: true
      timeoutS: 30
      resultArtifact: opened
      resultValidation:
        maxBytes: 4096
        schema:
          type: object
          required: [result, tabId, url]
          properties:
            result: { const: opened }
            tabId: { type: integer, minimum: 1 }
            url: { type: string, minLength: 1 }
    e2llm.read_page:
      class: read
      timeoutS: 30
      resultArtifact: page
      resultValidation:
        maxBytes: 8192
        schema:
          type: object
          required: [content, url, stats]
          properties:
            content: { type: string, minLength: 1 }
            url: { type: string, minLength: 1 }
            stats:
              type: object
              required: [contentNodes, truncated]
              properties:
                contentNodes: { type: integer, minimum: 1 }
                truncated: { const: false }
            selectorUnmatched: { const: false }
      shape: { strip: [content], toFile: true }
entryStep: open_page
nodes:
  open_page: { kind: task, taskRef: open-page, onVerified: read_page }
  read_page: { kind: task, taskRef: read-page, onVerified: summarize }
  summarize: { kind: task, taskRef: summarize-page, onVerified: done }
  done: { kind: end, outcome: succeeded }
